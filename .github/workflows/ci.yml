name: CI

# CI 分层口径（指标分层陈述，不把单测数/评测样本数/浏览器场景数混加为大数字）：
# - 第 1 层（本 workflow，push/PR 自动跑）：快速检查 = 各模块单测 + 前端 type-check 构建；
# - 第 2 层（手动 workflow_dispatch 触发）：RAG 检索评测（离线确定性、无需 LLM Key）；
# - 第 3 层（本地/手动）：需 LLM Key 的意图/Judge 全量评测与 Playwright 浏览器验收——
#   不接受外部模型波动阻塞 PR。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  admin-test:
    name: cucumber-admin (Spring Boot) mvn test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: mvn test
        working-directory: cucumber-admin
        run: mvn -B test

  ai-test:
    name: cucumber-ai (FastAPI) pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: cucumber-ai/requirements.txt
      - name: install dependencies
        working-directory: cucumber-ai
        run: pip install -r requirements.txt
      - name: pytest
        working-directory: cucumber-ai
        env:
          LLM_PROVIDER: mock
        run: pytest tests/ -q

  agent-test:
    name: cucumber-agent (FastAPI) pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cucumber-agent/echomind/requirements.txt
      - name: install dependencies
        working-directory: cucumber-agent/echomind
        run: pip install -r requirements.txt pytest
      - name: pytest
        working-directory: cucumber-agent/echomind
        run: pytest tests/ -q

  web-build:
    name: cucumber-web (Vue3) type-check + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cucumber-web/package-lock.json
      - name: npm ci
        working-directory: cucumber-web
        run: npm ci
      - name: build (含 vue-tsc type-check 前置)
        working-directory: cucumber-web
        run: npm run build

  rag-eval:
    name: 第 2 层·RAG 检索评测（手动触发，离线确定性）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cucumber-agent/echomind/requirements.txt
      - name: install dependencies
        working-directory: cucumber-agent/echomind
        run: pip install -r requirements.txt
      - name: run retrieval eval (v4 全量 + held-out)
        working-directory: cucumber-agent/echomind
        run: |
          python -m evaluation.run_retrieval --version v4 --download-model --out /tmp/rag_v4.json
          python -m evaluation.run_retrieval --version v4 --held-out --download-model --out /tmp/rag_v4_heldout.json
